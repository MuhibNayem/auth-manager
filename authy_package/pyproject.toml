[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "authy-package"
version = "2.0.0"
description = "Enterprise-grade authentication platform for Python"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Authy Team", email = "team@authy.dev"}]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Framework :: Django",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: WSGI",
]

dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0",
    "aiohttp>=3.8.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0", "uvicorn[standard]>=0.23.0"]
flask = ["flask>=2.3.0"]
django = ["django>=4.2.0"]
postgresql = ["asyncpg>=0.29.0", "sqlalchemy>=2.0.0"]
mongodb = ["motor>=3.3.0"]
dynamodb = ["aioboto3>=12.0.0"]
saml = ["lxml>=4.9.0", "xmlsec>=1.3.14"]
oidc = ["authlib>=1.2.0"]
all = [
    "authy-package[fastapi,flask,django]",
    "authy-package[postgresql,mongodb,dynamodb]",
    "authy-package[saml,oidc]",
]

[project.scripts]
authy = "authy_package.cli:main"

[project.urls]
Homepage = "https://github.com/authy-package/authy"
Documentation = "https://docs.authy.dev"
Repository = "https://github.com/authy-package/authy.git"
Issues = "https://github.com/authy-package/authy/issues"

[tool.setuptools.packages.find]
include = ["authy_package*"]
