[tool.poetry]
name = "authy-server"
version = "3.0.0"
description = "Enterprise Identity and Access Management Platform - Competitor to Keycloak"
authors = ["Authy Team <team@authy.dev>"]
license = "MIT"
readme = "README.md"
homepage = "https://authy.dev"
repository = "https://github.com/authy-dev/authy-server"
documentation = "https://docs.authy.dev"
keywords = [
    "identity",
    "authentication",
    "authorization",
    "oidc",
    "oauth2",
    "saml",
    "scim",
    "sso",
    "iam",
    "keycloak-alternative",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.2.1"
pyjwt = "^2.8.0"
cryptography = "^42.0.0"
python-multipart = "^0.0.6"
lxml = "^5.1.0"
xmlsec = "^1.3.14"
aiohttp = "^3.9.0"
redis = "^5.0.0"
asyncpg = "^0.29.0"
alembic = "^1.13.0"
prometheus-client = "^0.19.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
httpx = "^0.26.0"
black = "^24.1.0"
ruff = "^0.1.0"
mypy = "^1.8.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
authy-server = "authy_server.main:main"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "D", "UP"]
ignore = ["D100", "D104"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
