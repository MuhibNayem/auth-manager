# Single source of truth for packaging metadata (docs/CONTRACTS.md §11).
#
# - Distribution name: tessera (PyPI), import name: tessera
# - Version MUST stay in sync with tessera/__init__.py:__version__
#   (enforced by the "version-sync" job in .github/workflows/ci.yml).
# - The legacy tessera/pyproject.toml (setuptools) and
#   tessera/requirements-enterprise.txt were deleted; they are
#   superseded by this file. See docs/REMEDIATION_STATUS_packaging.md.
# - CI builds/publishes with plain pip + PEP 517 (poetry-core backend);
#   Poetry itself is not required to build or publish.

[tool.poetry]
name = "tessera"
version = "2.0.0"
description = "Enterprise-grade authentication platform for Python: traditional auth, MFA, passwordless, sessions, organizations, RBAC, audit logging, webhooks, SAML/OIDC SSO, and framework adapters for FastAPI, Flask, and Django."
authors = ["A K M Muhibullah Nayem <nayem.drmc@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/MuhibNayem/auth-manager"
packages = [{ include = "tessera" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Topic :: Security",
    "Topic :: System :: Systems Administration :: Authentication/Directory",
]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/MuhibNayem/auth-manager/issues"

[tool.poetry.scripts]
tessera = "tessera.cli:main"

[tool.poetry.dependencies]
python = ">=3.9,<4.0"

# --- Slim core: everything needed for traditional auth, sessions, MFA and CLI ---
pyjwt = "^2.9.0"
cryptography = ">=41.0.0"
bcrypt = ">=4.0.0"
httpx = ">=0.27.0"
aiohttp = "^3.9.0"
requests = "^2.32.0"
click = "^8.1.0"
rich = "^13.0.0"
python-dotenv = "^1.0.0"
redis = "^5.0.0"
pyotp = "^2.9.0"
python-multipart = ">=0.0.9"

# --- Optional dependencies (installed via extras, see [tool.poetry.extras]) ---
# Argon2 password hashing backend (contract §2: bcrypt by default, argon2 optional).
argon2-cffi = { version = ">=23.1.0", optional = true }
# Framework adapters
fastapi = { version = ">=0.100.0", optional = true }
uvicorn = { version = ">=0.23.0", optional = true }
flask = { version = ">=3.0.0", optional = true }
django = { version = ">=4.2.0", optional = true }
# Databases
sqlalchemy = { version = "^2.0.0", optional = true }
asyncpg = { version = ">=0.29.0", optional = true }
motor = { version = ">=3.3.0", optional = true }
aioboto3 = { version = ">=12.0.0", optional = true }
# Enterprise SSO (SAML 2.0)
lxml = { version = ">=4.9.0", optional = true }
xmlsec = { version = ">=1.3.14", optional = true }
python3-saml = { version = ">=1.14.0", optional = true }
# SMS providers
twilio = { version = ">=8.0.0", optional = true }
boto3 = { version = ">=1.28.0", optional = true }
# Passkeys / WebAuthn
webauthn = { version = ">=2.0.0", optional = true }
# Development tooling
pytest = { version = ">=8.0.0", optional = true }
pytest-asyncio = { version = ">=0.23.0", optional = true }
pytest-cov = { version = ">=5.0.0", optional = true }
ruff = { version = ">=0.4.0", optional = true }
mypy = { version = ">=1.8.0", optional = true }

[tool.poetry.extras]
fastapi = ["fastapi", "uvicorn"]
flask = ["flask"]
django = ["django"]
postgresql = ["sqlalchemy", "asyncpg"]
mongodb = ["motor"]
dynamodb = ["aioboto3"]
saml = ["lxml", "xmlsec", "python3-saml"]
# OIDC needs no extra dependencies: the implementation uses the core
# pyjwt/cryptography/aiohttp stack. The extra exists as an install marker.
oidc = []
sms = ["twilio", "boto3"]
# CAPTCHA providers (hCaptcha/reCAPTCHA) call out via core httpx.
captcha = []
webauthn = ["webauthn"]
all = [
    "argon2-cffi",
    "fastapi",
    "uvicorn",
    "flask",
    "django",
    "sqlalchemy",
    "asyncpg",
    "motor",
    "aioboto3",
    "lxml",
    "xmlsec",
    "python3-saml",
    "twilio",
    "boto3",
    "webauthn",
]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "ruff", "mypy"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# --- Tooling baselines (docs/CONTRACTS.md §11: lenient baseline is acceptable) ---

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = ["tessera/ui_kits"]

[tool.ruff.lint]
# Lenient baseline: import/syntax-level pyflakes + critical pycodestyle only.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
check_untyped_defs = false
follow_imports = "skip"
